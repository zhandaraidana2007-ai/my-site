<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <title>7 мамыр</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: pink;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .box {
      text-align: center;
    }

    h1 {
      font-size: 32px;
      color: black;
    }

    p {
      font-size: 18px;
      font-weight: bold;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      color: white;
      cursor: pointer;
      margin: 10px;
      position: absolute;
    }
#yes {
  position: relative;
  z-index: 2;
}

#no {
  position: absolute;
  z-index: 1;
}
    #yes {
      background-color: green;
    }

    #no {
      background-color: red;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>7 мамырға подарок керек па?</h1>
    <p>Ия ия, жоқ жоқ тез айтшы?</p>

    <button id="yes" onclick="yesClick()">Ия</button>
    <button id="no" onmouseover="moveNo()">Жоқ</button>
  </div>

  <script>
    function moveNo() {
      let noBtn = document.getElementById("no");

      let x = Math.random() * (window.innerWidth - 100);
      let y = Math.random() * (window.innerHeight - 60);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }
    }
  </script>

</body>
</html>
